name: NCS Build

on: [push, pull_request]

env:
  NCS_VERSION: v3.3.1
  NCS_INSTALL_DIR: /home/runner/ncs

jobs:
  build-l15:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache NCS SDK
        id: cache-ncs
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/ncs
            /home/runner/.nrfutil
          key: ncs-${{ env.NCS_VERSION }}-${{ runner.os }}-v2

      - name: Install nrfutil
        run: |
          curl -L -o nrfutil \
            https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
          chmod +x nrfutil
          sudo mv nrfutil /usr/local/bin/
          nrfutil self-upgrade
          nrfutil install sdk-manager
          nrfutil sdk-manager config install-dir set "${NCS_INSTALL_DIR}"

      - name: Install NCS SDK and toolchain
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: nrfutil sdk-manager install "${NCS_VERSION}"

      - name: Build firmware (XIAO nRF54L15)
        env:
          NCS_ROOT: /home/runner/ncs/v3.3.1
        run: ./build.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xiao-nrf54l15
          path: |
            build/merged.hex
            build/zephyr/zephyr/zephyr.signed.bin
            build/dfu_application.zip
          if-no-files-found: error

  build-lm20:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache NCS SDK
        id: cache-ncs
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/ncs
            /home/runner/.nrfutil
          key: ncs-${{ env.NCS_VERSION }}-${{ runner.os }}-v2

      - name: Install nrfutil
        run: |
          curl -L -o nrfutil \
            https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
          chmod +x nrfutil
          sudo mv nrfutil /usr/local/bin/
          nrfutil self-upgrade
          nrfutil install sdk-manager
          nrfutil sdk-manager config install-dir set "${NCS_INSTALL_DIR}"

      - name: Install NCS SDK and toolchain
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: nrfutil sdk-manager install "${NCS_VERSION}"

      - name: Build firmware (XIAO nRF54LM20A)
        env:
          NCS_ROOT: /home/runner/ncs/v3.3.1
          BOARD: xiao_nrf54lm20a/nrf54lm20a/cpuapp
          BUILD_DIR: build-lm20
        run: ./build.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xiao-nrf54lm20a
          path: |
            build-lm20/merged.hex
            build-lm20/zephyr/zephyr/zephyr.signed.bin
            build-lm20/dfu_application.zip
          if-no-files-found: error
