name: Release Firmware

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  NCS_VERSION: v3.3.1
  NCS_INSTALL_DIR: /home/runner/ncs

jobs:
  build-and-upload:
    name: Build & Upload Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Parse release tag
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Tag must look like MAJOR.MINOR or MAJOR.MINOR.PATCH (optional leading v). Got: ${TAG}"
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          [[ -z "${PATCH}" ]] && PATCH=0
          if (( MAJOR > 255 || MINOR > 255 || PATCH > 255 )); then
            echo "MAJOR, MINOR, and PATCH must be 0..255"
            exit 1
          fi
          # Pass the full tag (with optional v) so OD_FW_VERSION parses all three parts.
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Parsed ${TAG} -> ${MAJOR}.${MINOR}.${PATCH}"

      - name: Cache NCS SDK
        id: cache-ncs
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/ncs
            /home/runner/.nrfutil
          key: ncs-${{ env.NCS_VERSION }}-${{ runner.os }}-v2

      - name: Install nrfutil
        run: |
          curl -L -o nrfutil \
            https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
          chmod +x nrfutil
          sudo mv nrfutil /usr/local/bin/
          nrfutil self-upgrade
          nrfutil install sdk-manager
          nrfutil sdk-manager config install-dir set "${NCS_INSTALL_DIR}"

      - name: Install NCS SDK and toolchain
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: nrfutil sdk-manager install "${NCS_VERSION}"

      - name: Build nRF54L15 Firmware
        env:
          NCS_ROOT: /home/runner/ncs/v3.3.1
          BUILD_VERSION: ${{ steps.ver.outputs.tag }}
          OD_FW_VERSION: ${{ steps.ver.outputs.tag }}
          SHA: ${{ github.sha }}
        run: ./build.sh

      - name: Build nRF54LM20A Firmware
        env:
          NCS_ROOT: /home/runner/ncs/v3.3.1
          BUILD_VERSION: ${{ steps.ver.outputs.tag }}
          OD_FW_VERSION: ${{ steps.ver.outputs.tag }}
          SHA: ${{ github.sha }}
          BOARD: xiao_nrf54lm20a/nrf54lm20a/cpuapp
          BUILD_DIR: build-lm20
        run: ./build.sh

      - name: Package firmware
        run: |
          mkdir -p firmware_output
          TAG="${{ steps.ver.outputs.tag }}"
          cp build/merged.hex "firmware_output/nrf54l15-${TAG}.hex"
          cp build-lm20/merged.hex "firmware_output/nrf54lm20a-${TAG}.hex"
          if [[ -f build/zephyr/zephyr/zephyr.signed.bin ]]; then
            cp build/zephyr/zephyr/zephyr.signed.bin "firmware_output/nrf54l15-${TAG}-app_update.bin"
          fi
          if [[ -f build-lm20/zephyr/zephyr/zephyr.signed.bin ]]; then
            cp build-lm20/zephyr/zephyr/zephyr.signed.bin "firmware_output/nrf54lm20a-${TAG}-app_update.bin"
          fi
          if [[ -f build/dfu_application.zip ]]; then
            cp build/dfu_application.zip "firmware_output/nrf54l15-${TAG}-dfu.zip"
          fi
          if [[ -f build-lm20/dfu_application.zip ]]; then
            cp build-lm20/dfu_application.zip "firmware_output/nrf54lm20a-${TAG}-dfu.zip"
          fi

      - name: Upload Release Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: firmware_output/*
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true
